# Timber Tandem: static site (public/) + room relay (/relay) in one Worker.
#   npm run dev      local, http://localhost:8787 (phones need HTTPS: use deploy)
#   npm run deploy   timber-tandem.<account>.workers.dev
name = "timber-tandem"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/relay", "/health"]

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "TimberRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TimberRoom"]
