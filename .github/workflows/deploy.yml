name: Deploy

# Every push to main deploys to https://timber.housetandem.com (site + room
# relay, one Worker) after the typecheck and unit tests pass.
# https://timber.housetandem.com/version.json shows the commit and time.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus
# Workers Routes / custom domain on the housetandem.com zone).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Typecheck and unit tests
        run: npm run check
      - name: Deploy (stamps version.json first)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 87260c174f34fc18e96f2f47344e8d26
